<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Wit Grid Performance Studio</title>
		<!-- Add Google Font Outfit -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
		<!-- The built-in grid themes' fonts (BUILT_IN_THEME_FONTS_URL); each falls back to a system stack. -->
		<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
		<!-- React Scan (render highlighting) only with ?scan in the URL: it keeps every rendered element in
		     its history (memory grows as you use the demo) and adds work to each React render. It must run
		     before React, so it is written in as a parser-blocking script. -->
		<script>
			if (new URLSearchParams(location.search).has('scan'))
				document.write('<script src="https://unpkg.com/react-scan/dist/auto.global.js"><\/script>');
		</script>
	</head>
	<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden h-screen w-screen m-0">
		<div id="root" class="h-full w-full"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
